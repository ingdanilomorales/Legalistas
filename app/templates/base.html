<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Legalistas{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark brand-nav">
    <div class="container">
      <a class="navbar-brand brand-lockup fw-semibold" href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='img/legalistas-logo.jpeg') }}" alt="Legalistas, estudio jurídico" class="brand-logo"> <span>Legalistas</span></a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Abrir navegación"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="{{ url_for('index') }}">Resumen</a>
          <a class="nav-link" href="{{ url_for('clients') }}">Clientes</a>
          <a class="nav-link" href="{{ url_for('report') }}">Informe mensual</a>
        </div>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button></div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
